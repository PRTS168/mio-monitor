org.gradle.jvmargs=-Xmx2304m -Dfile.encoding=UTF-8
# v0.29.0: 本机仅 8GB RAM——Kotlin 编译并入 Gradle 单次 daemon（单 JVM），
# 避免 Gradle daemon + 独立 Kotlin daemon 双 JVM 峰值叠加触发 OOM（编译被静默 kill / exit -1），
# 同时消除 "Detected multiple Kotlin daemon sessions" 冲突。
kotlin.compiler.execution.strategy=in-process
# 限制 dex/资源等 worker 并发，压低同时内存峰值
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
